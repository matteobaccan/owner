</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-class="lead" data-theme="default" data-style=":root {
  --bg: #14161b;
  --bg-soft: #1b1e25;
  --fg: #e7e9ee;
  --muted: #9aa3b2;
  --accent: #ffc93c;
  --rule: #2b3040;
}
section {
  background: var(--bg);
  background-image: radial-gradient(ellipse 80% 55% at 50% -10%, #232838 0%, transparent 70%);
  color: var(--fg);
  font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
  font-size: 25px;
  line-height: 1.5;
  letter-spacing: .1px;
  padding: 56px 68px;
  justify-content: flex-start;
}
h1 {
  color: var(--accent);
  font-size: 46px;
  font-weight: 700;
  letter-spacing: -.4px;
  margin: 0 0 .55em 0;
  padding-bottom: .28em;
  border-bottom: 2px solid var(--rule);
}
h2 { color: var(--accent); font-size: 32px; font-weight: 650; margin: .2em 0 .4em; }
strong { color: #fff; }
a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule); }
code, pre, kbd { font-family: 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
/* inline code */
p code, li code, td code, h2 code {
  background: #232833; color: #ffd970;
  padding: .06em .34em; border-radius: 4px; font-size: .88em;
}
pre {
  background: var(--bg-soft);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: .75em 1em;
  font-size: 19px;
  line-height: 1.45;
  overflow: visible;
}
pre code { font-size: inherit; color: #dfe4ec; text-shadow: none; }

/* ---- syntax colours, tuned for a dark background ----
   Prism (.token.*) is what Marp ships; the .hljs-* twins keep this
   readable if the deck is ever rendered by a highlight.js pipeline. */
.token.comment, .token.prolog, .token.doctype, .token.cdata,
.hljs-comment, .hljs-quote {
  color: #7d8798; font-style: italic;
}
.token.punctuation, .token.operator, .token.entity,
.hljs-punctuation {
  color: #aab4c4;
}
.token.keyword, .token.atrule, .token.important, .token.selector,
.hljs-keyword, .hljs-literal, .hljs-selector-tag {
  color: #c792ea; font-weight: 600;
}
.token.string, .token.char, .token.attr-value, .token.inserted,
.token.value, .token.url,
.hljs-string, .hljs-attr, .hljs-addition {
  color: #a5e075;
}
.token.number, .token.boolean, .token.constant, .token.symbol,
.hljs-number, .hljs-literal {
  color: #ff9d5c;
}
.token.class-name, .token.builtin, .token.tag,
.hljs-title, .hljs-type, .hljs-class, .hljs-name, .hljs-section {
  color: #6fd3ff;
}
.token.function, .hljs-function, .hljs-title.function_ {
  color: #82aaff;
}
.token.annotation, .token.meta, .token.decorator,
.hljs-meta, .hljs-doctag {
  color: #ffc93c;
}
/* .properties and .env sources: key on the left, value on the right */
.token.key, .token.attr-name, .token.property,
.hljs-attribute, .hljs-variable {
  color: #6fd3ff;
}
.token.variable { color: #ffc93c; }
.token.deleted, .hljs-deletion { color: #ff7b72; }
ul, ol { margin: 0; padding-left: 1.15em; }
li { margin-bottom: .42em; }
li::marker { color: var(--accent); }
/* the bundled theme paints tables for a light background: undo that */
table, thead, tbody, tfoot, tr, th, td {
  background: transparent !important;
  background-color: transparent !important;
  color: inherit;
  border-color: var(--rule) !important;
}
table { border-collapse: collapse; font-size: .84em; width: 100%; margin: .2em 0; }
th, td { border: 0; border-bottom: 1px solid var(--rule); padding: .38em .6em; text-align: left; }
th { color: var(--accent); font-weight: 600; }
tbody tr:nth-child(odd) td { background: rgba(255,255,255,.028) !important; }
blockquote { border-left: 3px solid var(--accent); margin: 0; padding-left: .9em; color: var(--muted); }

/* ---- layout helpers ---- */
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.columns.wide-left  { grid-template-columns: 1.25fr 1fr; }

<ul>
<li>OWNER's goal is to minimize the code required for properties based configuration in Java applications.</li>
<li>An open source (BSD License) Java library.</li>
<li>Artifacts are available on <strong>Maven Central Repository</strong> (latest release 1.0.12; 2.0.0 in preparation).</li>
<li>Source code is managed on <strong>GitHub</strong>, at <code>matteobaccan/owner</code>.</li>
<li>Inspired on how <strong>GWT i18n</strong> manages translations on client side.</li>
<li>Requires Java 8 or newer.</li>
<li>No dependencies on 3rd party libraries.</li>
</ul>

<h1 id="what">What?</h1>
<p>What are the <u>very basic things</u> needed to handle properties files?</p>
<ul>
<li>load the file (from the filesystem? from the classpath?)</li>
<li>define a configuration object that exposes its settings via convenient business methods.</li>
<li>do the conversion (boolean, int, URLs, Files, Objects…).</li>
<li>define default values when not specified in the file.</li>
<li>etc…</li>
</ul>
</section>

<p>How OWNER do its stuff without being repetitive?</p>
<div class="columns">
<div>
<p class="step">1 — the properties file</p>
<p><code>ServerConfig.properties</code>, in a given java package:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">port</span>=<span class="hljs-string">80</span>
<span class="hljs-attr">hostname</span>=<span class="hljs-string">foobar.com</span>
<span class="hljs-attr">maxThreads</span>=<span class="hljs-string">100</span>
</code></pre>
</div>
<div>
<p class="step">2 — the mapping interface</p>
<p>A class named the same way, <code>ServerConfig.java</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> org.aeonbits.owner.Config;

    <span class="hljs-type">int</span> <span class="hljs-title function_">port</span><span class="hljs-params">()</span>;
    <span class="hljs-type">String</span> <span class="hljs-title function_">hostname</span><span class="hljs-params">()</span>;
    <span class="hljs-meta">@DefaultValue(&quot;42&quot;)</span>
    <span class="hljs-type">int</span> <span class="hljs-title function_">maxThreads</span><span class="hljs-params">()</span>;
}
</code></pre>
</div>
</div>

<p><em>&quot;Simple things should be simple,<br />

-- Alan Kay (Computer Scientist)</p>

<ul>
<li>Things should be as much simple as they can be.<br />
New/advanced features should not complicate the basic usages.</li>
<li>Convention over configuration.<br />

<li>Use of annotations to customize the default behavior.</li>
</ul>

<h1 id="features-overview">Features Overview</h1>
<ul>
<li>
<p><u>Powerful</u> Type Conversion; supports collections, primitives, common Java objects and user defined objects.</p>
</li>
<li>
<p>Loading properties from multiple resources.</p>
</li>
<li>
<p>Two different &quot;Loading Strategies&quot;: load the FIRST resource, MERGE all the available resources.</p>
</li>
<li>
<p>Importing (wrap) existing properties objects, as well as system properties and environment variables.</p>
</li>
<li>
<p>Variables Expansion via the <code>${variable}</code> notation.</p>
</li>
</ul>
</section>

<h1 id="features-overview-1">Features Overview</h1>
<ul>
<li>
<p>Hot Reload and programmable reload.</p>
</li>
<li>
<p>Event notification. On reload, and on property change. With some basic validation mechanism.</p>
</li>
<li>
<p>&quot;Accessible&quot; and &quot;Mutable&quot; interface to add capabilities to access or change a Config object.</p>
</li>
<li>
<p>Debugging facilities.</p>
</li>
<li>
<p>Multiple formats: XML and Properties files support; user can implement and configure custom loader for more file formats.</p>
</li>
</ul>
</section>

<h1 id="type-conversion-6">Type Conversion</h1>
<p>To recap, all the types supported by OWNER for conversion:</p>
<ol>
<li>Primitive types: <code>boolean</code>, <code>byte</code>, <code>short</code>, <code>integer</code>, <code>long</code>, <code>float</code>, <code>double</code>.</li>
<li>Enums (notice that the conversion is case sensitive, so FOO != foo or Foo).</li>
<li><code>java.lang.String</code>, of course (no conversion is needed).</li>
<li><code>java.net.URL</code>, <code>java.net.URI</code>.</li>
<li><code>java.io.File</code> (the character <code>~</code> will be expanded to <code>user.home</code> System Property).</li>
<li><code>java.lang.Class</code> (this can be useful, for instance, if you want to load the jdbc driver, or similar cases).</li>
</ol>
</section>

<h1 id="type-conversion-7">Type Conversion</h1>
<ol start="7">
<li>Any instantiable class declaring a public constructor with a single argument of type <code>java.lang.String</code>.</li>
<li>Any instantiable class declaring a public constructor with a single argument of type <code>java.lang.Object</code>.</li>
<li>Any class declaring a public static method <code>valueOf(java.lang.String)</code> that returns an instance of itself.</li>
<li>Any class for which you can register a <code>PropertyEditor</code> via <code>PropertyEditorManager.registerEditor()</code>.</li>
<li>Any array having above types as elements.</li>
<li>Any object that can be instantiated via <code>@ConverterClass</code> annotation explained before.</li>
<li>Any Java Collections of all above types: <code>Set</code>, <code>List</code>, <code>SortedSet</code> or concrete implementations like <code>LinkedHashSet</code>, or user defined collections having a default no-arg constructor.</li>
<li><code>Map</code> and sub-interfaces, reading a <strong>group of properties</strong> under a common prefix. <em>(2.0.0)</em></li>
</ol>
</section>

<h1 id="loading-strategies">Loading Strategies</h1>
<p>Common utilities (especially in unix) allow multiple configuration files.</p>
<p>Tipically a System Level configuration located in</p>
<p><code>/etc/myapp.conf</code></p>
<p>and a User Level configuration located in</p>
<p><code>~/.myapp.conf</code></p>
<p>an example is the git scm command line tool.</p>
</section>

<h1 id="loading-strategies-1">Loading Strategies</h1>
<p>A User Level configuration may totally override the configuration at System Level, or may just redefine some options. Example:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">$ </span><span class="language-bash"><span class="hljs-built_in">cat</span> .gitconfig                 $ <span class="hljs-built_in">cat</span> .git/config</span>
[user]                           [core]
    name = Luigi R. Viggiano         repositoryformatversion = 0
    email = luigi.viggiano@…         filemode = true
[color]                              bare = false
    ui = true                        logallrefupdates = true
[merge]                          [remote &quot;origin&quot;]
    tool = p4merge                   url = git@github.com:matteobaccan/owner.git
[diff]                           [branch &quot;master&quot;]
    tool = p4merge                   remote = origin
[push]                               merge = refs/heads/master
    default = upstream
</code></pre>
<p>Repository Level Configuration overrides user level configuration</p>
</section>

<h1 id="loading-strategies-4">Loading Strategies</h1>
<p><code>@Sources</code> annotation supports variable expansion:</p>
<ul>
<li>
<p><code>file:${user.home}/.myapp.config</code> (system property)</p>
</li>
<li>
<p><code>file:${HOME}/.myapp.config</code> (environment variable)</p>
</li>
<li>
<p><code>file:~/.myapp.config</code> (the '~' literal accepted by bash)</p>
</li>
</ul>
<p>Above examples are equivalent.</p>

<h1 id="loading-strategies-5">Loading Strategies</h1>
<p><code>@Sources</code> annotation can also expand variables specified programmatically:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// notice ${mypath} here</span>

<span class="hljs-keyword">interface</span> <span class="hljs-title class_">MyConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> { ... }

<span class="hljs-comment">// notice ${mypath} here</span>

<span class="hljs-type">MyConfig</span> <span class="hljs-variable">cfg</span> <span class="hljs-operator">=</span> ConfigFactory.create(MyConfig.class);

<h1 id="loading-strategies-6">Loading Strategies</h1>
<p><code>@Sources</code> annotation can also expand variables specified programmatically:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// notice ${myurl} here</span>
<span class="hljs-meta">@Sources(&quot;${myurl}&quot;)</span>;
<span class="hljs-keyword">interface</span> <span class="hljs-title class_">MyConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> { ... }

<span class="hljs-comment">// notice ${myurl} here</span>
ConfigFactory.setProperty(
  <span class="hljs-string">&quot;myurl&quot;</span>, <span class="hljs-string">&quot;http://somewhere.com/conf.properties&quot;</span>);
<span class="hljs-type">MyConfig</span> <span class="hljs-variable">cfg</span> <span class="hljs-operator">=</span> ConfigFactory.create(MyConfig.class);
</code></pre>
<p>The ConfigFactory can accept configuration properties itself. I call this &quot;Metaconfiguring&quot;</p>

<span class="hljs-attr">target.attribute</span>=<span class="hljs-string">lazy</span>
<span class="hljs-attr">color</span>=<span class="hljs-string">brown</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">ConfigWithExpansion</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {

<h1 id="interfaces-tree">Interfaces Tree</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>       Serializable
            ▲
            │
          Config
            ▲
   ┌────────┼────────┐
Reloadable Mutable Accessible
</code></pre>
<ul>
<li><code>Config</code> (is a marker interface).</li>
<li><code>Reloadable</code> defines methods to programmatically realod the configuration and to attach <code>ReloadListener</code>s</li>
<li><code>Accessible</code> define methods to access internal properties values, and to save/dump to <code>OutputStream</code> or <code>Writer</code></li>
<li><code>Mutable</code> defines methods to change properties values programmatically and attach <code>PropertyChangeListener</code>s</li>
</ul>
</section>

<h1 id="xml-support">XML Support</h1>
<p>The <code>java.util.Properties</code> class supports an XML format that looks like this:</p>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-meta">&lt;?xml version=<span class="hljs-string">&quot;1.0&quot;</span> encoding=<span class="hljs-string">&quot;UTF-8&quot;</span>?&gt;</span>
<span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">properties</span> <span class="hljs-keyword">SYSTEM</span>
  <span class="hljs-string">&quot;http://java.sun.com/dtd/properties.dtd&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">properties</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">comment</span>&gt;</span>this is an example<span class="hljs-tag">&lt;/<span class="hljs-name">comment</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">entry</span> <span class="hljs-attr">key</span>=<span class="hljs-string">&quot;server.ssh.alive.interval&quot;</span>&gt;</span>60<span class="hljs-tag">&lt;/<span class="hljs-name">entry</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">entry</span> <span class="hljs-attr">key</span>=<span class="hljs-string">&quot;server.ssh.address&quot;</span>&gt;</span>127.0.0.1<span class="hljs-tag">&lt;/<span class="hljs-name">entry</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">entry</span> <span class="hljs-attr">key</span>=<span class="hljs-string">&quot;server.http.port&quot;</span>&gt;</span>80<span class="hljs-tag">&lt;/<span class="hljs-name">entry</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">entry</span> <span class="hljs-attr">key</span>=<span class="hljs-string">&quot;server.http.hostname&quot;</span>&gt;</span>localhost<span class="hljs-tag">&lt;/<span class="hljs-name">entry</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">entry</span> <span class="hljs-attr">key</span>=<span class="hljs-string">&quot;server.ssh.user&quot;</span>&gt;</span>admin<span class="hljs-tag">&lt;/<span class="hljs-name">entry</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">entry</span> <span class="hljs-attr">key</span>=<span class="hljs-string">&quot;server.ssh.port&quot;</span>&gt;</span>22<span class="hljs-tag">&lt;/<span class="hljs-name">entry</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">properties</span>&gt;</span>
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">server.http.port</span>=<span class="hljs-string">80</span>
<span class="hljs-attr">server.http.hostname</span>=<span class="hljs-string">localhost</span>
<span class="hljs-attr">server.ssh.port</span>=<span class="hljs-string">22</span>
<span class="hljs-attr">server.ssh.address</span>=<span class="hljs-string">127.0.0.1</span>
<span class="hljs-attr">server.ssh.alive.interval</span>=<span class="hljs-string">60</span>
<span class="hljs-attr">server.ssh.user</span>=<span class="hljs-string">admin</span>
</code></pre>
<p>…a <em>fantastic*</em> facility compared to the plain textual format of properties files, uh?</p>
<p><span class="note">The * means &quot;I'm ironic&quot;</span></p>

<h1 id="xml-support-1">XML Support</h1>
<p>OWNER supports the previous XML format for properties as well as any XML that can be possible mapped to a properties list. Example:</p>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">server</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">http</span> <span class="hljs-attr">port</span>=<span class="hljs-string">&quot;80&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">hostname</span>&gt;</span>localhost<span class="hljs-tag">&lt;/<span class="hljs-name">hostname</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">http</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">ssh</span> <span class="hljs-attr">port</span>=<span class="hljs-string">&quot;22&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">address</span>&gt;</span>127.0.0.1<span class="hljs-tag">&lt;/<span class="hljs-name">address</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">alive</span> <span class="hljs-attr">interval</span>=<span class="hljs-string">&quot;60&quot;</span>/&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">user</span>&gt;</span>admin<span class="hljs-tag">&lt;/<span class="hljs-name">user</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">ssh</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">server</span>&gt;</span>
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">server.http.port</span>=<span class="hljs-string">80</span>
<span class="hljs-attr">server.http.hostname</span>=<span class="hljs-string">localhost</span>
<span class="hljs-attr">server.ssh.port</span>=<span class="hljs-string">22</span>
<span class="hljs-attr">server.ssh.address</span>=<span class="hljs-string">127.0.0.1</span>
<span class="hljs-attr">server.ssh.alive.interval</span>=<span class="hljs-string">60</span>
<span class="hljs-attr">server.ssh.user</span>=<span class="hljs-string">admin</span>
</code></pre>
<p>The developer is free to use tags and attributes to define properties names. Better now?</p>

<h1 id="xml-support-2">XML Support</h1>
<div style="text-align:center">
<h2 id="q-how-to-load-the-xml-into-the-config-object">Q: How to load the XML into the Config object?</h2>
</div>
<p>A: Simple: in the same way as you already do for properties file.</p>
<ol>
<li>
<p>Suppose you have a mapping interface class in a source file called foo.bar.ServerConfig.java, just place a resource in your classpath in foo.bar.ServerConfig.xml.</p>
</li>
<li>
<p>Or you can specify the <code>@Sources</code> annotation with an URL pointing to an file.xml. OWNER will notice the .xml extension and will load the configuration source as XML.</p>
</li>
</ol>
</section>

<h1 id="parameter-formatting">Parameter Formatting</h1>
<p>This comes directly from the GWT i18n:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Sample</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-meta">@DefaultValue(&quot;Hello Mr. %s!&quot;)</span>
    <span class="hljs-type">String</span> <span class="hljs-title function_">helloMr</span><span class="hljs-params">(String name)</span>;
}

<span class="hljs-type">Sample</span> <span class="hljs-variable">cfg</span> <span class="hljs-operator">=</span> ConfigFactory.create(Sample.class);
print(cfg.helloMr(<span class="hljs-string">&quot;Luigi&quot;</span>)); <span class="hljs-comment">// will println &#x27;Hello Mr. Luigi!&#x27;</span>
</code></pre>
<p>Not really related to configuration. Maybe I should drop this feature in favor of something better? The parameter could have been used for different purpose (i.e. a type safe setter method)</p>
</section>

<h1 id="disabling-unwanted-features">Disabling unwanted features</h1>
<p>Variables expansion, parameters formatting and the key prefix can be inconvenient if you have your own mechanisms. If for any reason you want to disable them, on class level or method level, you can use <code>@DisableFeature</code> annotation.</p>
<p>The disableable features are <code>VARIABLE_EXPANSION</code>, <code>PARAMETER_FORMATTING</code> and <code>PREFIX</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// on class level...</span>
<span class="hljs-meta">@DisableFeature({VARIABLE_EXPANSION, PARAMETER_FORMATTING})</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">SampleConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-meta">@DefaultValue(&quot;Earth&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">planet</span><span class="hljs-params">()</span>;

    <span class="hljs-comment">// on method level...</span>
    <span class="hljs-meta">@DisableFeature({VARIABLE_EXPANSION, PARAMETER_FORMATTING})</span>
    <span class="hljs-meta">@DefaultValue(&quot;Hello %s, welcome on ${planet}!&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">String</span> <span class="hljs-title function_">hello</span><span class="hljs-params">(String name)</span>;
}
</code></pre>

<h1 id="200-in-one-slide">2.0.0 in one slide</h1>
<ul>
<li><strong>Java 8 is the minimum runtime.</strong> <code>owner-java8</code> and <code>owner-java8-extras</code> are gone: <code>default</code> methods, <code>DurationConverter</code>, <code>ByteSize</code> are all in the core <code>owner</code> artifact now.</li>
<li><strong>New annotations:</strong> <code>@Prefix</code>, <code>@Mandatory</code>, <code>@Sensitive</code>, <code>@CollectionConverterClass</code>, <code>@DefaultValue(useOnEmpty = true)</code>.</li>
<li><strong>New return types:</strong> <code>Optional&lt;T&gt;</code>, <code>Map</code>— which used to throw on every access — and <strong>a nested interface</strong>, for a configuration that is not flat.</li>
<li><strong>New formats:</strong> <code>.env</code> in the core, and INI, JSON, YAML, TOML in <code>owner-formats</code>. Every parser written by hand, so the core still has <strong>no dependencies</strong>.</li>
<li><strong>New interface:</strong> <code>Traceable</code>, which says where a value came from.</li>
<li><strong>It stopped failing in silence:</strong> warnings where there were none, and <code>owner.strict</code> to refuse instead.</li>
<li><strong>A handful of behaviour changes</strong> that earned the major number.</li>
</ul>
</section>

<h1 id="prefix--the-rest-of-it">@Prefix — the rest of it</h1>
<div class="columns">
<div>
<p>The prefix is part of the key, so it expands variables like the rest of it:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Prefix(&quot;servers.${env:dev}.&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">ServerConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-type">String</span> <span class="hljs-title function_">name</span><span class="hljs-params">()</span>;
    <span class="hljs-type">String</span> <span class="hljs-title function_">hostname</span><span class="hljs-params">()</span>;
    <span class="hljs-type">Integer</span> <span class="hljs-title function_">port</span><span class="hljs-params">()</span>;
}
</code></pre>
<p><code>PREFIX</code> is a disableable feature, for the method that has to opt out:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@DisableFeature(PREFIX)</span>
<span class="hljs-meta">@DefaultValue(&quot;UTF-8&quot;)</span>
<span class="hljs-type">String</span> <span class="hljs-title function_">encoding</span><span class="hljs-params">()</span>;          <span class="hljs-comment">// encoding, not server.encoding</span>
</code></pre>
</div>
<div>
<p>A prefix can also be configured <strong>on the factory</strong>, for the interfaces that declare none:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Factory</span> <span class="hljs-variable">factory</span> <span class="hljs-operator">=</span> ConfigFactory.newInstance();
factory.setProperty(
    <span class="hljs-string">&quot;owner.key.prefix.from.package&quot;</span>, <span class="hljs-string">&quot;true&quot;</span>);
</code></pre>
<table>
<thead>
<tr>
<th>property</th>
<th>effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>owner.key.prefix</code></td>
<td>a literal, prepended to every key</td>
</tr>
<tr>
<td><code>owner.key.prefix.from.package</code></td>
<td>the package of the declaring interface, plus a dot</td>
</tr>
</tbody>
</table>
<p>OWNER already derived the <em>file</em> name from the package; it was only the <strong>keys</strong> that were left out of that convention.</p>
</div>
</div>

<h1 id="optional-and-mandatory">Optional and @Mandatory</h1>
<div class="columns">
<div>
<p class="step">absence, declared in the signature</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Optional</span>&lt;Integer&gt; <span class="hljs-title function_">port</span><span class="hljs-params">()</span>;
</code></pre>
<p>Comes back empty when the property is defined nowhere and has no default, instead of <code>null</code>.</p>
<p>Everything else applies unchanged: <code>@Key</code>, <code>@Prefix</code>, preprocessors, expansion, decryption. A value that is <strong>wrong</strong> rather than missing keeps failing — a typo does not silently become an empty <code>Optional</code>.</p>
</div>
<div>
<p class="step">absence, refused outright</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Mandatory</span>
<span class="hljs-type">String</span> <span class="hljs-title function_">url</span><span class="hljs-params">()</span>;
</code></pre>
<p>A <code>MissingMandatoryPropertyException</code> lists <strong>all</strong> the unresolvable keys when the Config is created — and again on access, if a mandatory property disappears after a hot reload.</p>
</div>
</div>
<p><code>@Mandatory</code> and <code>Optional</code> on the same method contradict each other, and are reported when the object is created.</p>
</section>

<h1 id="sensitive">@Sensitive</h1>
<p>A <code>cfg.list(System.out)</code> added while debugging and then forgotten is how a password ends up in a log file.</p>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">DbConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Accessible</span> {
    <span class="hljs-type">String</span> <span class="hljs-title function_">url</span><span class="hljs-params">()</span>;

    <span class="hljs-type">String</span> <span class="hljs-title function_">username</span><span class="hljs-params">()</span>;

    <span class="hljs-meta">@Sensitive</span>
    <span class="hljs-type">String</span> <span class="hljs-title function_">password</span><span class="hljs-params">()</span>;
}
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">cfg.list(System.out);
<span class="hljs-comment">// -- listing properties --</span>
<span class="hljs-comment">// url=jdbc:postgresql://localhost/app</span>
<span class="hljs-comment">// username=app</span>
<span class="hljs-comment">// password=********</span>
</code></pre>
</div>
</div>
<p>Only the output <strong>meant to be read by a human</strong> is masked — <code>list()</code> and <code>toString()</code>. The method itself, <code>getProperty()</code>, <code>fill()</code>, <code>store()</code>, <code>storeToXML()</code> and the JMX attributes keep returning the real value: those are how a configuration is written back, and masking them would save <code>********</code> into the file.</p>
<blockquote>
<p>Masking is not encryption. For that there is a marker — <code>db.password=${$aes-gcm::…}</code> — whose values are printed as the marker and unreadable already.</p>
</blockquote>
</section>

<h1 id="map-and-lists-one-element-per-key">Map, and lists one element per key</h1>
<div class="columns">
<div>
<p class="step">a group of properties</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">credentials.user</span>=<span class="hljs-string">admin</span>
<span class="hljs-attr">credentials.password</span>=<span class="hljs-string">secret</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Map</span>&lt;String, String&gt; <span class="hljs-title function_">credentials</span><span class="hljs-params">()</span>;
</code></pre>
<p>Reads everything below the key of the method. A <code>SortedMap</code> comes back as a <code>TreeMap</code>, a plain <code>Map</code> as a <code>LinkedHashMap</code>; <code>EnumMap</code> is refused, and so is a <code>@DefaultValue</code> on a map. No match gives an empty map, never <code>null</code>.</p>
</div>
<div>
<p class="step">one element per key</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">servers[0]</span>=<span class="hljs-string">alpha</span>
<span class="hljs-attr">servers[1]</span>=<span class="hljs-string">beta</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">List</span>&lt;String&gt; <span class="hljs-title function_">servers</span><span class="hljs-params">()</span>;   <span class="hljs-comment">// [alpha, beta]</span>
</code></pre>
<p>Open as a request since 2013.</p>
<p>Marking a <code>Map</code> <code>@Sensitive</code> masks <strong>everything</strong> under the prefix — picking out the entries that look like a secret would be guesswork.</p>
</div>

<h1 id="env-files">.env files</h1>
<p>How container tooling carries configuration into a process: <code>docker run --env-file</code>, <code>env_file</code> in Compose, <code>envFrom</code> in Kubernetes, the secrets of a CI pipeline.</p>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-comment"># .env</span>
<span class="hljs-attr">DB_HOST</span>=<span class="hljs-string">localhost</span>
<span class="hljs-attr">DB_PORT</span>=<span class="hljs-string">5432</span>
<span class="hljs-attr">NAME</span>=<span class="hljs-string">&quot;Matteo&quot;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Sources(&quot;file:.env&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">AppConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-meta">@Key(&quot;DB_HOST&quot;)</span>
    <span class="hljs-type">String</span> <span class="hljs-title function_">dbHost</span><span class="hljs-params">()</span>;
}
</code></pre>
<p>A <code>.env</code> is <strong>never looked for on its own</strong>: it is not named after the interface, so it is always named explicitly.</p>
</div>
<div>
<p><strong>There is no <code>.env</code> standard.</strong> Given <code>NAME=&quot;Matteo&quot;</code>, <code>docker run --env-file</code> gives you the quotes and the <code>dotenv</code> family does not — and Compose agrees with neither.</p>
<p>So OWNER implements a <strong>dialect</strong>, not &quot;the format&quot;: three presets — <code>docker</code>, <code>dotenv</code>, <code>compose</code> — plus seven rules settable on their own.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Sources(&quot;file:.env#dialect=dotenv&quot;)</span>
</code></pre>
<p><code>docker</code> is the default, because it does nothing to a value: quotes that arrive attached are noticed at once, quotes silently removed are not.</p>
</div>
</div>
</section>

<h1 id="options-on-a-source-loaders-on-the-classpath">Options on a source, loaders on the classpath</h1>
<div class="columns">
<div>
<p class="step">the fragment belongs to OWNER</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Sources(&quot;https://cfg/app.env?token=abc#dialect=dotenv&quot;)</span>
</code></pre>
<p>The <strong>query belongs to the protocol</strong> and is never touched — the token reaches the server. The fragment is also the only place options can be written for a resource inside a jar, whose URI has no query.</p>
<p>An option a loader does not recognise is <strong>refused, not ignored</strong>, and the message names the option, the source, and what would have been accepted.</p>
</div>
<div>
<p class="step">a jar that ships a format</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>META-INF/services/
  org.aeonbits.owner.loaders.Loader
</code></pre>
<p>Declared there, a loader is picked up when a factory is created — no <code>registerLoader()</code> call. Being found is what enables it: it answers for its formats at once, and its default file names join the ones looked for when an interface declares no <code>@Sources</code>.</p>
</div>
</div>

<h1 id="nested-configuration">Nested configuration</h1>
<p>A configuration is rarely flat, and since 2.0.0 an interface can have the shape the file has.</p>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">server.host</span>=<span class="hljs-string">localhost</span>
<span class="hljs-attr">server.port</span>=<span class="hljs-string">8080</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">AppConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-type">ServerConfig</span> <span class="hljs-title function_">server</span><span class="hljs-params">()</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">ServerConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-type">String</span> <span class="hljs-title function_">host</span><span class="hljs-params">()</span>;
    <span class="hljs-type">int</span> <span class="hljs-title function_">port</span><span class="hljs-params">()</span>;
}
</code></pre>
<p>The section shares its parent's sources, its reload and its listeners — it is a <strong>view</strong>, not a copy.</p>
</div>
<div>
<p class="step">four shapes, one convention</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">servers[0].host</span>=<span class="hljs-string">alpha     # a list</span>
<span class="hljs-attr">servers.beta.host</span>=<span class="hljs-string">beta    # a map</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">List</span>&lt;ServerConfig&gt; <span class="hljs-title function_">servers</span><span class="hljs-params">()</span>;
<span class="hljs-type">Map</span>&lt;String, ServerConfig&gt; <span class="hljs-title function_">servers</span><span class="hljs-params">()</span>;

<span class="hljs-meta">@Key(&quot;servers.%s&quot;)</span>

<h1 id="four-more-formats-still-no-dependencies">Four more formats, still no dependencies</h1>
<p><code>.env</code> in the core; <strong>INI, JSON, YAML and TOML</strong> in a new <code>owner-formats</code> artifact — every parser written by hand.</p>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Sources(&quot;classpath:app.yaml&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">AppConfig</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_">Config</span> {
    <span class="hljs-type">ServerConfig</span> <span class="hljs-title function_">server</span><span class="hljs-params">()</span>;
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">server:</span>
  <span class="hljs-attr">host:</span> <span class="hljs-string">localhost</span>
  <span class="hljs-attr">port:</span> <span class="hljs-number">8080</span>
</code></pre>
<p>They flatten to the same keys nesting reads, so a format is a way of writing the file and nothing more.</p>
</div>
<div>
<p class="step">a documented subset, refused by name</p>
<p>The YAML parser is ~450 lines rather than 5000: anchors, aliases, merge keys, tags and a second document are <strong>refused, naming the line</strong>, instead of half-supported.</p>
<p>The Norway problem never arises — the literal scalar is kept and the <strong>interface</strong> declares the type.</p>
<p>A repeated key is a <strong>list</strong>, because that is already what a repeated XML element is here.</p>
</div>
</div>

<div class="columns">

<h1 id="it-works-and-it-lies">It works and it lies</h1>
<p>OWNER's way of failing is to keep working: a source that cannot be read is passed over, the object is built out of defaults, and the caller gets something that answers every question. That is a fallback doing its job — and it is also what a misspelt path looks like.</p>
<div class="columns">
<div>
<p class="step">2.0.0 says what happened</p>
<ul>
<li>a source <strong>named</strong> and unreadable</li>
<li><strong>not one</strong> declared source readable</li>
<li><code>@HotReload</code> over what cannot be watched</li>
<li>a value built out of an <strong><code>@EncryptedValue</code></strong> one (a marker has no such problem)</li>
<li>and, at <code>CONFIG</code>, what was <em>decided</em>: which sources, which loader, which key each method reads</li>
</ul>
<p>Never a value: that is what <code>@Sensitive</code> is for. And said <strong>once</strong> — a hot reload runs the load again at its interval.</p>
</div>
<div>
<p class="step">or refuses outright</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Factory</span> <span class="hljs-variable">f</span> <span class="hljs-operator">=</span> ConfigFactory.newInstance();
f.setProperty(<span class="hljs-string">&quot;owner.strict&quot;</span>, <span class="hljs-string">&quot;true&quot;</span>);
</code></pre>
<p>Every warning becomes a refusal when the object is created.</p>
<p><strong>What counts as a failure is not a list of its own — it is the warnings</strong>, which already leave the legitimate cases alone. A source that is merely absent stays silent under strict too: <code>LoadType.FIRST</code> expects misses by design.</p>
</div>
</div>

<h1 id="a-password-in-the-file-and-a-cipher-to-put-it-there">A password in the file, and a cipher to put it there</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">db.password</span> = <span class="hljs-string">${$aes-gcm::AAM0UBtPtHU9kZcgvqX673gZ...}</span>
<span class="hljs-attr">jdbc.url</span>    = <span class="hljs-string">jdbc:h2:mem:test?password=${db.password}</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">ConfigFactory.registerValueHandler(
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">AesGcmHandler</span>(passphrase));
</code></pre>
<p>Nothing on the interface. <code>password()</code> is an ordinary <code>String</code> method, and <code>jdbcUrl()</code> gets <strong>the secret</strong>, because a marker <em>is</em> expansion.</p>
<p>Until 2.0.0 this library shipped <strong>no cipher at all</strong> — and the documentation published an AES/ECB example for the reader to copy, under which two equal passwords have equal ciphertext.</p>
</div>
<div>
<p class="step">and the one that changes who can do what</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-properties"><span class="hljs-attr">api.token</span> = <span class="hljs-string">${$rsa-oaep::7VcoaAGAX+3tbyARpqJRCyZ4...}</span>
</code></pre>
<p>With a key pair, whoever <em>writes</em> a secret holds only the public key: a CI job can add one <strong>without being able to read the others</strong>.</p>
<ul>
<li>AES-256/GCM, PBKDF2 at 210,000 — measured, not guessed</li>
<li><code>store()</code> writes the marker back; <code>fill()</code> gets the secret</li>
<li><code>EncryptTool</code> in the same jar; the passphrase is never an argument</li>
<li>no discovery: a cipher on the classpath is not a decision anybody took</li>
</ul>
<p><code>${$vault::…}</code>, <code>${$file::…}</code> — the envelope knows nothing about cryptography.</p>
</div>
</div>

<h1 id="the-smaller-things-that-add-up">The smaller things that add up</h1>
<ul>
<li><strong><code>java.time.Duration</code> is converted out of the box</strong>, like a <code>File</code> or a <code>URL</code>.</li>
<li><strong><code>ByteSize</code></strong> implements <code>Comparable</code> and <code>Serializable</code>, and gains <code>in(ByteSizeStandard)</code>.</li>
<li><strong>The single-method SPIs are <code>@FunctionalInterface</code></strong>: <code>Converter</code>, <code>Preprocessor</code> and <code>ReloadListener</code> can officially be lambdas.</li>
<li><strong><code>@DefaultValue(useOnEmpty = true)</code></strong> — for the value left empty by a template, as in <code>port=${PORT}</code> with <code>PORT</code> unset. Opt-in and per method: an empty value falls back on the default, while a value that is <em>wrong</em> keeps failing.</li>
<li><strong><code>@CollectionConverterClass</code></strong> hands the raw value to a single converter instead of tokenizing first.</li>
<li><strong><code>Accessible.store(Writer, String)</code></strong>, mirroring <code>Properties.store(Writer, String)</code>.</li>
<li><strong><code>Accessible.getRawProperty(key)</code></strong> — the value as it was written, for whatever is on its way back to a file.</li>
<li>The jars declare an <code>Automatic-Module-Name</code>.</li>
</ul>
</section>

<h1 id="why-the-major-number">Why the major number</h1>
<p>Everything else is additive. Four changes alter the result of a configuration that used to work, and a patch number would have been a quiet place to put them. Two are about variables:</p>
<ul>
<li>
<p><strong>Braces are matched, not counted from the left.</strong> Up to 1.0.12 a <code>${</code> was closed by the first <code>}</code> that followed it; now by the one that matches it, which is what makes <strong>nested variables</strong> possible.<br />
<code>-Downer.nested.variable.expansion=false</code> restores the old behaviour for the whole JVM.</p>
</li>
<li>
<p><strong>A circular variable reference is an error.</strong> It used to exhaust the stack, or — for <code>a=${a:default}</code> — to produce an empty string. Now it throws, naming the chain. No cycle ever produced a useful value, but a configuration that quietly resolved to <code>&quot;&quot;</code> will now fail loudly, which is the point.</p>
</li>
</ul>
</section>

<h1 id="why-the-major-number--the-other-two">Why the major number — the other two</h1>
<ul>
<li>
<p><strong><code>getProperty</code> and <code>fill</code> expand the variables now.</strong> They returned the text as written, so the same property answered two ways depending on whether it was read through its method or by name — which somebody reported in 2022, and worked around by reaching our private substitutor field with reflection.<br />
The line is drawn where the value is <strong>going</strong>: what writes the properties out — <code>list</code>, <code>store</code>, <code>storeToXML</code> — still leaves them exactly as written, because what goes out has to be able to come back. <code>getRawProperty</code> is the old behaviour under a name that says what it does.</p>
</li>
<li>
<p><strong>Repeated sibling elements in an XML source are numbered.</strong> Two elements of the same name under the same parent used to write the same key, so every value but the last was lost without a word. They now become <code>parent.tag[0]</code> and <code>parent.tag[1]</code> — which is what a list is read from. An element occurring once keeps its plain key.</p>
</li>
</ul>
<p><code>Accessible</code> also gains two abstract methods, so an implementation of it written by hand needs them — the interface is meant for the proxy, but it is a public type and that is a break like any other.</p>
</section>

<h1 id="future--as-of-2014">Future — as of 2014</h1>
<ul>
<li>Validation (JSR 349? Bean Validation?)</li>

<li>Singleton mechanism.</li>
<li>Any other idea? Join and help!</li>
</ul>

<h1 id="and-what-became-of-it">…and what became of it</h1>
<table>
<thead>
<tr>
<th>2014</th>
<th>today</th>
</tr>
</thead>
<tbody>
<tr>
<td>Encryptable Properties</td>
<td>✔ <code>@EncryptedValue</code> since 1.0.10 — and since 2.0.0 a cipher we actually ship, named in the value</td>
</tr>
<tr>
<td>Variable Expansion in <code>@Key</code></td>
<td>✔ since 1.0.6</td>
</tr>
<tr>
<td>JMX bean</td>
<td>✔ every <code>Config</code> is a <code>DynamicMBean</code></td>
</tr>
<tr>
<td>Singleton mechanism</td>
<td>✔ <code>ConfigCache</code></td>
</tr>
<tr>
<td>More file formats</td>
<td>✔ <code>.env</code> in the core; INI, JSON, YAML, TOML in <code>owner-formats</code>; HOCON and JNDI in <code>owner-extras</code></td>
</tr>
<tr>
<td>Validation</td>
<td>- still open</td>
</tr>
</tbody>
</table>
<p>Arrived without being asked for: <code>@Prefix</code>, Preprocessors, <code>@Sensitive</code> masking, transactional event listeners.</p>
</section>
