name: Publish site

# Publishes the documentation website: syncs owner-site/site onto the
# gh-pages branch, from which GitHub Pages builds and serves
# https://matteobaccan.github.io/owner/
#
# The copy is additive, like the historical `ant publish`: files that exist
# only on gh-pages (e.g. apidocs/, maintained by `ant javadoc publish`) are
# preserved.

on:
  push:
    branches: [ master ]
    paths:
      - 'owner-site/site/**'
      - '.github/workflows/site.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Checkout gh-pages
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Sync site content
      run: rsync -av owner-site/site/ gh-pages/

    - name: Commit and push
      working-directory: gh-pages
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to publish"
        else
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push origin gh-pages
        fi
