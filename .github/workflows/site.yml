name: Publish site

# Builds the documentation website with Astro/Starlight and syncs the result
# onto the gh-pages branch, from which GitHub Pages serves
# https://matteobaccan.github.io/owner/
#
# The sync deletes files that the build no longer produces, so that the leftover
# Jekyll sources (_layouts, _includes, _posts, css, js …) do not linger on the
# branch forever. Two directories are excluded from that deletion because they
# are not ours to manage and cannot be regenerated from this build:
#
#   apidocs/     the Javadoc, published separately by `ant javadoc publish`
#   .well-known/ holds brave-rewards-verification.txt; deleting it silently
#                breaks the verification
#
# The build also refuses to publish anything that would load a resource from an
# external host — see owner-site/web/scripts/check-external-references.mjs.

on:
  push:
    branches: [ master ]
    paths:
      - 'owner-site/web/**'
      - '.github/workflows/site.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: owner-site/web/package-lock.json

    - name: Install dependencies
      working-directory: owner-site/web
      # --ignore-scripts: a lifecycle script runs arbitrary code from a transitive dependency, with the
      # workflow's token in the environment. Only two packages in the tree declare one - fsevents, which is
      # macOS only, and esbuild, whose binary comes from the platform package @esbuild/linux-x64 rather than
      # from its script. sharp and pagefind ship theirs as ordinary packages too, so nothing here needs a
      # script to work: verified by installing this lock file with the flag and building the site from it.
      run: npm ci --ignore-scripts

    - name: Build the site
      working-directory: owner-site/web
      run: npm run build

    - name: Check that nothing is loaded from an external host
      working-directory: owner-site/web
      run: npm run check:external

    - name: Checkout gh-pages
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Sync site content
      run: |
        rsync -av --delete \
          --exclude '.git/' \
          --exclude 'apidocs/' \
          --exclude '.well-known/' \
          owner-site/web/dist/ gh-pages/

    - name: Commit and push
      working-directory: gh-pages
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to publish"
        else
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push origin gh-pages
        fi
