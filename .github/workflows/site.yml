name: Publish site

# Builds the documentation website with Astro/Starlight, renders the Marp decks
# under presentation/ into it, and syncs the result onto the gh-pages branch, from
# which GitHub Pages serves https://matteobaccan.github.io/owner/
#
# The deck is part of this build and not a workflow of its own, because it is
# documentation like the rest and publishing it separately bought nothing and cost
# two things: a second job pushing to the same branch, which two runs landing
# together would have turned into a rejected push, and a deck that had to be
# checked for external references by a step of its own instead of by the check
# that already runs over the whole site.
#
# The sync deletes files that the build no longer produces, so that the leftover
# Jekyll sources (_layouts, _includes, _posts, css, js …) do not linger on the
# branch forever. Two directories are excluded from that deletion because they
# are not ours to manage and cannot be regenerated from this build:
#
#   apidocs/     the Javadoc, published separately by `ant javadoc publish`
#   .well-known/ holds brave-rewards-verification.txt; deleting it silently
#                breaks the verification
#
# presentation/ is deliberately NOT among them: this build produces it now, so
# excluding it would stop rsync from copying it rather than protect it.
#
# The build also refuses to publish anything that would load a resource from an
# external host — see owner-site/web/scripts/check-external-references.mjs. That
# check covers the deck too, which is not a formality: Marp turns emoji into <img>
# tags pointing at a CDN, and it caught exactly that the first time it ran.

on:
  push:
    branches: [ master ]
    paths:
      - 'owner-site/web/**'
      - 'presentation/**'
      - '.github/workflows/site.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: owner-site/web/package-lock.json

    - name: Install Marp
      # At the repository root and with --no-save, so that it stays out of the
      # site's dependency tree: the site declares three dependencies and rendering
      # a slide deck is no reason for a documentation edit to install a hundred
      # and fifty more. --ignore-scripts for the reason given below; verified that
      # the renderer works when installed this way. The version is pinned, as every
      # other version in this repository is.
      run: npm install --no-save --ignore-scripts --no-audit --no-fund @marp-team/marp-cli@4.5.0

    - name: Render the decks into the site
      # The binary installed by the step above, called directly rather than through
      # npx. npx would run the same renderer here, but it can also fetch a package
      # on demand - unpinned, and running the lifecycle scripts the step above takes
      # care to skip - so the one path that could undo that precaution is closed
      # rather than merely unused. Code scanning reported it as S6505 and S8543.
      #
      # public/ is copied into the build verbatim, so the deck arrives in dist/ as
      # an ordinary asset and is covered by the external-reference check below
      # without a step of its own.
      run: ./node_modules/.bin/marp --input-dir presentation --output owner-site/web/public/presentation --html

    - name: Install dependencies
      working-directory: owner-site/web
      # --ignore-scripts: a lifecycle script runs arbitrary code from a transitive
      # dependency, with the workflow's token in the environment. Only two packages
      # in the tree declare one - fsevents, which is macOS only, and esbuild, whose
      # binary comes from the platform package @esbuild/linux-x64 rather than from
      # its script. sharp and pagefind ship theirs as ordinary packages too, so
      # nothing here needs a script to work: verified by installing this lock file
      # with the flag and building the site from it.
      run: npm ci --ignore-scripts

    - name: Build the site
      working-directory: owner-site/web
      run: npm run build

    - name: Check that nothing is loaded from an external host
      working-directory: owner-site/web
      run: npm run check:external

    - name: Checkout gh-pages
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Sync site content
      run: |
        rsync -av --delete \
          --exclude '.git/' \
          --exclude 'apidocs/' \
          --exclude '.well-known/' \
          owner-site/web/dist/ gh-pages/

    - name: Commit and push
      working-directory: gh-pages
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to publish"
        else
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push origin gh-pages
        fi
