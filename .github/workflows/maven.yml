name: Owner build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # LTS releases; JDK 8 is excluded because compiler-release=8
        # requires a JDK 9+ compiler, while bytecode stays Java 8 compatible
        java: [ 11, 17, 21, 25 ]

    name: Build with JDK ${{ matrix.java }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: ${{ matrix.java }}
        cache: maven

    - name: Build with Maven
      run:
        mvn -B clean install --file pom.xml

  sonar:
    runs-on: ubuntu-latest

    name: SonarCloud analysis

    # Skip forked PRs: they don't have access to the SONAR_TOKEN secret
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        # Full history improves the relevance of SonarCloud analysis
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
        cache: maven

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run:
        mvn -B -Pcoverage clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --file pom.xml
