# A HOCON document with the things a properties file cannot say: comments, nesting without
# repeating the path, a substitution, and a list of objects.

datacentre = "eu-west"

server {
  host = localhost
  port = 8080
}

// the same object, written again, merges rather than replacing - HOCON's own rule
server {
  timeout = 30s
}

servers = [
  { host = alpha, region = ${datacentre} },
  { host = beta,  region = ${datacentre} }
]

pools {
  small { size = 4 }
  large { size = 64 }
}

ports = [80, 443]

proxy = null
